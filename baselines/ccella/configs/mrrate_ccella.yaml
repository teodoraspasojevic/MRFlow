# CCELLA adapted to MR-RATE -- the run.
#
# Step budget is this repository's fairness contract for a baseline: 60,000 optimizer updates,
# the same number MRFlow's own fine-tune took (`experiments/mrflow_from_ct_checkpoint`) and the
# same number `baselines/text2ct/configs/mrrate_finetune.yaml` pins to. The step count is what is
# matched, not the epoch count -- one MRFlow sample is a 16-slice block pair while one sample here
# is a whole volume.
#
# Everything under `volume:` and `text:` is upstream CCELLA's own preprocessing constant; see
# volume.py and text.py, which name the upstream line each one came from.

mrrate:
  # null keeps MR-RATE's duplicate acquisitions of one contrast and plane (`t1w-raw-axi-2`, ...),
  # which is the population MRFlow and Text2CT both train on: 575,328 train series.
  max_repeats: null
  max_series_train: null
  max_series_val: 2000
  seed: 42

volume:
  # 256 x 256 x 224 at 1 mm RAS -> latent 4 x 64 x 64 x 56. Every axis is divisible by 32 (MAISI
  # downsamples 4x, the UNet a further 8x).
  #
  # Measured on 400 MR-RATE brain masks: a centred crop keeps the whole brain for 99.5% of series
  # at I-S 224 and only 95.8% at I-S 192, while the in-plane axes are not binding at all (192x224
  # scores exactly the same as 256x256). 256 in depth buys nothing over 224. The 256^2 in-plane is
  # kept because it is MRFlow's own evaluation grid, which makes `canonicalize_external` a pure
  # depth operation at scoring time.
  grid: [256, 256, 224]
  spacing_mm: [1.0, 1.0, 1.0]
  percentile_lower: 0.0
  percentile_upper: 99.5
  clip: true

text:
  encoder: google/flan-t5-xxl
  hidden_size: 4096
  max_length: 512
  sections: [findings, impression]

data:
  cache_root: /hnvme/workspace/y100dc19-mrflow-final/baselines/ccella_cache
  num_workers: 8

model:
  latent_channels: 4
  pos_weight_cap: 20.0
  text_class_pred_weight: 1.0e-4      # upstream's lambda, unchanged -- see the README

train:
  max_train_steps: 150000
  checkpoint_steps: [20000, 40000, 60000, 80000, 100000, 120000, 140000, 145000, 150000]
  # 16 x 8 GPUs = effective batch 128. MRFlow's own fine-tune and baselines/text2ct are pinned at
  # 60,000 updates at that batch; this run goes to 150,000 (33.4 epochs) deliberately. Training a
  # baseline *longer* than the model it is a baseline for is the safe direction -- it cannot be
  # read as handicapping it -- and the checkpoint is selected on val, never on test.
  # There is no gradient accumulation here --
  # upstream's train_one_epoch steps the optimizer every iteration -- so the micro batch IS the
  # per-GPU batch and this number is what sets the effective one.
  #
  # Measured on one h200 at latent 4 x 64 x 64 x 56 (job 894895):
  #    bs  4: 167 ms/step  23.9 vol/s  22.6 GiB   ->  eff 32,  2.8 h
  #    bs  8: 273 ms/step  29.4 vol/s  37.5 GiB   ->  eff 64,  4.5 h
  #    bs 16: 495 ms/step  32.3 vol/s  67.3 GiB   ->  eff 128, 8.3 h   <-- throughput saturates here
  #    bs 24: 746 ms/step  32.2 vol/s  97.1 GiB   ->  eff 192, 12.4 h
  micro_batch_size: 16
  lr: 1.0e-4                          # upstream's
  num_train_timesteps: 1000           # upstream's DDPM schedule
  seed: 42
  log_every: 10
  output_dir: /hnvme/workspace/y100dc19-mrflow-final/baselines/ccella_runs/ccella_mrrate

validation:
  every: 2500                         # scoring: losses, AUROC/AP, per-label table
  visualize_every: 10000              # the preview video: one full sampling chain, ~200 s
  samples: 4
  subset: 256
  visualize: true
  # MUST equal train.num_train_timesteps -- MONAI's DDPMScheduler.step uses
  # alphas_cumprod[timestep - 1], so it removes exactly one timestep of noise per call. A strided
  # set_timesteps(50) advances the announced timestep by 20 each call, so after 50 calls ~95% of
  # the noise is still there and the preview decodes to pure noise. Upstream says 1000 for this
  # same reason. config.validate now refuses anything else.
  inference_steps: 1000

wandb:
  project: MRFlow
  group: baselines
  name: ccella_mrrate
  # A W&B id can never be reused once its run has been DELETED -- wandb.init then fails with
  # "run <id> was previously created and deleted; try a new run id". So bump the suffix rather
  # than deleting a run, and give any smoke run its own id (`--set wandb.id=ccella_smoke`) so it
  # cannot claim this one.
  id: ccella_mrrate_v1
