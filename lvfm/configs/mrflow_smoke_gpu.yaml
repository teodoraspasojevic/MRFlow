globals:
  target_fps: 32
  target_nframes: 16
  outputs:
  - video
  - image
  resolution: 256
  latent_res: 32
  latent_channels: 16
  max_steps: 60000
max_train_steps: 20
gradient_accumulation_steps: 1
mixed_precision: bf16
use_ema: true
max_grad_norm: 1.0
max_grad_value: -1
sample_latents: false
decode_scale: 255.0
decode_shift: 0.0
black_value: 0.0
white_value: 1.0
mri:
  raw_root: /hnvme/workspace/y100dc19-MR-Rate-raw
  dataset_root: /hnvme/workspace/y100dc19-mrflow/data/mrflow_flux
  text_checkpoint: /hnvme/workspace/y100dc19-nvidia-mri-brain/pretrained/BiomedVLP-CXR-BERT-specialized
  text_max_length: 512
  marker_weight: 1.0
  vae_batch_size: 32
  max_repeats: 1
  max_series_train: 120000
  max_series_val: 2000
  max_series_test: null
  preprocess:
    target_spacing:
    - 1.0
    - 1.0
    - 1.0
    inplane_size: ${globals.resolution}
    posterior_shift_mm: 15.0
    max_slices: 320
    min_slices: 32
denoiser:
  target: echosyn.common.models.DiffuserSTDiT
  args:
    input_size:
    - ${globals.target_nframes}
    - ${globals.latent_res}
    - ${globals.latent_res}
    in_channels: 32
    out_channels: ${globals.latent_channels}
    patch_size:
    - 2
    - 2
    - 2
    hidden_size: 1024
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    drop_path: 0.0
    no_temporal_pos_emb: false
    caption_channels: 768
    model_max_length: 1
    space_scale: 1.0
    time_scale: 1.0
    enable_flashattn: false
optimizer:
  target: torch.optim.AdamW
  args:
    lr: 2.0e-05
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.01
    eps: 1.0e-08
scheduler:
  target: echosyn.common.schedulers.StepBasedLearningRateScheduleWithWarmup
  args:
    warmup_steps: 500
    ref_steps: 60000
    eta_min: 1.0e-06
    decay_rate: 2.0
vae:
  target: diffusers.AutoencoderKL
  pretrained: /hnvme/workspace/y100dc19-mrflow/models/flux-vae-f8-16ch
datasets:
- name: MRRateLatentBlock
  active: true
  params:
    root: ${mri.dataset_root}
    split: train
    block_size: ${globals.target_nframes}
    p_start: 0.3
    p_end: 0.2
val_datasets:
- name: MRRateLatentBlock
  active: true
  params:
    root: ${mri.dataset_root}
    split: val
    block_size: ${globals.target_nframes}
    p_start: 0.0
    p_end: 0.0
    deterministic: true
    seed: ${seed}
dataloader:
  target: torch.utils.data.DataLoader
  args:
    shuffle: true
    batch_size: 8
    num_workers: 8
    pin_memory: true
    drop_last: true
    persistent_workers: true
noise_offset: 0.05
noise_cond_image: 0.05
no_conditionning: false
p_drop_conditionning: 0.0
output_dir: /hnvme/workspace/y100dc19-mrflow/experiments/${wandb_args.name}
logging_dir: logs
report_to: wandb
wandb_args:
  project: MRFlow
  name: smoke_gpu_check
  group: smoke
  id: smoke_gpu_check
checkpointing_steps: 10
checkpoints_to_keep:
- 20
init_from: /hnvme/workspace/y100dc19-mrflow/models/ctflow/checkpoint-680000/denoiser_ema
resume_from_checkpoint: latest
if_fine_tuned: false
validation:
  samples: 2
  steps: 10
  timesteps: 25
  frames: ${globals.target_nframes}
  fps: ${globals.target_fps}
seed: 42
